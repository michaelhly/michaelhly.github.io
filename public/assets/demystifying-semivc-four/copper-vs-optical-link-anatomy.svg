<svg width="1200" height="872" viewBox="0 0 1200 872" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Copper vs. Optical Link Anatomy</title>
  <desc>
    A polished anatomy comparison of a copper link and an optical link between a GPU and a switch. The copper link shows one passive twinax span. The optical link shows powered transmit and receive transceivers, fiber and connector interfaces, and the additional active or aging-sensitive components in the path.
  </desc>

  <defs>
    <filter id="soft-shadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#172033" flood-opacity="0.10"/>
    </filter>

    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.4 L8 5 L2 8.6" fill="none" stroke="#5f6675" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <marker id="arrow-optical" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.4 L8 5 L2 8.6" fill="none" stroke="#1677bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <linearGradient id="copper-cable" x1="248" y1="0" x2="952" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e7fbf2"/>
      <stop offset="0.5" stop-color="#c9f1e4"/>
      <stop offset="1" stop-color="#e7fbf2"/>
    </linearGradient>

    <linearGradient id="fiber-glow" x1="520" y1="0" x2="690" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5bb8ff"/>
      <stop offset="0.5" stop-color="#9ee7ff"/>
      <stop offset="1" stop-color="#5bb8ff"/>
    </linearGradient>
  </defs>

  <style>
    svg {
      color: #172033;
      background: #f7f9fc;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .page-bg {
      fill: #f7f9fc;
    }

    .title {
      fill: #111827;
      font-size: 36px;
      font-weight: 760;
    }

    .subtitle {
      fill: #596272;
      font-size: 17px;
      font-weight: 450;
    }

    .eyebrow {
      fill: #596272;
      font-size: 13px;
      font-weight: 700;
    }

    .lane {
      fill: #ffffff;
      stroke: #d8dde7;
      stroke-width: 1.2;
      filter: url(#soft-shadow);
    }

    .lane-title {
      fill: #111827;
      font-size: 21px;
      font-weight: 720;
    }

    .lane-subtitle {
      fill: #667085;
      font-size: 14px;
      font-weight: 460;
    }

    .endpoint {
      fill: #f8fafc;
      stroke: #aeb7c6;
      stroke-width: 1.1;
    }

    .endpoint-title {
      fill: #202938;
      font-size: 17px;
      font-weight: 720;
    }

    .endpoint-subtitle {
      fill: #6b7280;
      font-size: 11px;
      font-weight: 520;
    }

    .component-title {
      fill: #253044;
      font-size: 14px;
      font-weight: 720;
    }

    .component-label {
      font-size: 12px;
      font-weight: 680;
    }

    .small-label {
      fill: #667085;
      font-size: 12px;
      font-weight: 560;
    }

    .micro-label {
      fill: #6b7280;
      font-size: 10.5px;
      font-weight: 620;
    }

    .count-badge {
      fill: #eef6ff;
      stroke: #98c7f0;
      stroke-width: 1;
    }

    .count-text {
      fill: #155f97;
      font-size: 13px;
      font-weight: 720;
    }

    .passive {
      fill: #dcf8ed;
      stroke: #13916f;
      stroke-width: 1.2;
    }

    .passive-text {
      fill: #08745c;
    }

    .active {
      fill: #fff3d6;
      stroke: #c68116;
      stroke-width: 1.2;
    }

    .active-text {
      fill: #8b5610;
    }

    .aging {
      fill: #ffe7df;
      stroke: #d1633a;
      stroke-width: 1.2;
    }

    .aging-text {
      fill: #a54425;
    }

    .fiber {
      fill: #e8f5ff;
      stroke: #1677bd;
      stroke-width: 1.2;
    }

    .fiber-text {
      fill: #12659f;
    }

    .transceiver {
      fill: #fbfcff;
      stroke: #9aa5b8;
      stroke-width: 1.2;
      stroke-dasharray: 6 5;
    }

    .signal-neutral {
      stroke: #697386;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow-neutral);
    }

    .signal-optical {
      stroke: #1677bd;
      stroke-width: 2.4;
      fill: none;
      marker-end: url(#arrow-optical);
    }

    .footer {
      fill: #ffffff;
      stroke: #d8dde7;
      stroke-width: 1.1;
    }

    .footer-text {
      fill: #4b5563;
      font-size: 13px;
      font-weight: 520;
    }

    .footer-strong {
      fill: #172033;
      font-size: 13px;
      font-weight: 760;
    }
  </style>

  <rect class="page-bg" width="1200" height="872"/>

  <g aria-hidden="true" opacity="0.55">
    <path d="M80 104 H1120" stroke="#e5e9f1" stroke-width="1"/>
    <path d="M80 362 H1120" stroke="#e5e9f1" stroke-width="1"/>
    <path d="M80 772 H1120" stroke="#e5e9f1" stroke-width="1"/>
  </g>

  <text class="eyebrow" x="72" y="54">LINK ANATOMY</text>
  <text class="title" x="72" y="92">Copper vs. Optical Link Anatomy</text>
  <text class="subtitle" x="72" y="123">Copper is a passive cable; optical adds active conversion at both ends.</text>

  <g transform="translate(56 154)">
    <rect class="lane" x="0" y="0" width="1088" height="210" rx="18"/>
    <rect x="0" y="0" width="7" height="210" rx="3.5" fill="#13916f"/>

    <text class="lane-title" x="32" y="42">Copper link</text>
    <text class="lane-subtitle" x="32" y="65">Passive electrical span between the endpoints</text>

    <g transform="translate(812 28)">
      <rect class="count-badge" x="0" y="0" width="236" height="34" rx="17"/>
      <text class="count-text" x="118" y="22" text-anchor="middle">1 passive link body</text>
    </g>

    <g transform="translate(44 96)">
      <rect class="endpoint" x="0" y="0" width="132" height="72" rx="13"/>
      <text class="endpoint-title" x="66" y="32" text-anchor="middle">GPU</text>
      <text class="endpoint-subtitle" x="66" y="52" text-anchor="middle">electrical I/O</text>
      <path d="M15 18 h20 M15 36 h20 M15 54 h20 M97 18 h20 M97 36 h20 M97 54 h20" stroke="#bac3d1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="translate(912 96)">
      <rect class="endpoint" x="0" y="0" width="132" height="72" rx="13"/>
      <text class="endpoint-title" x="66" y="32" text-anchor="middle">Switch</text>
      <text class="endpoint-subtitle" x="66" y="52" text-anchor="middle">electrical I/O</text>
      <path d="M15 18 h20 M15 36 h20 M15 54 h20 M97 18 h20 M97 36 h20 M97 54 h20" stroke="#bac3d1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g>
      <path d="M200 132 H888" stroke="url(#copper-cable)" stroke-width="52" stroke-linecap="round"/>
      <path d="M200 132 H888" stroke="#13916f" stroke-width="32" stroke-linecap="round" opacity="0.28"/>
      <path d="M220 123 H868" stroke="#b86f2f" stroke-width="5" stroke-linecap="round"/>
      <path d="M220 141 H868" stroke="#b86f2f" stroke-width="5" stroke-linecap="round"/>
      <rect class="passive" x="360" y="90" width="368" height="84" rx="14"/>
      <text class="component-title passive-text" x="544" y="124" text-anchor="middle">Passive twinax cable</text>
      <text class="small-label" x="544" y="149" text-anchor="middle">No powered optics, lasers, or DSP in the cable body</text>
      <path class="signal-neutral" d="M176 132 H208"/>
      <path class="signal-neutral" d="M880 132 H912"/>
    </g>
  </g>

  <g transform="translate(56 402)">
    <rect class="lane" x="0" y="0" width="1088" height="322" rx="18"/>
    <rect x="0" y="0" width="7" height="322" rx="3.5" fill="#d1633a"/>

    <text class="lane-title" x="32" y="42">Optical link</text>
    <text class="lane-subtitle" x="32" y="65">Two powered modules plus an optical medium and connector interfaces</text>

    <g transform="translate(790 28)">
      <rect class="count-badge" x="0" y="0" width="258" height="34" rx="17"/>
      <text class="count-text" x="129" y="22" text-anchor="middle">6+ active or optical points</text>
    </g>

    <g transform="translate(36 118)">
      <rect class="endpoint" x="0" y="0" width="120" height="72" rx="13"/>
      <text class="endpoint-title" x="60" y="32" text-anchor="middle">GPU</text>
      <text class="endpoint-subtitle" x="60" y="52" text-anchor="middle">electrical I/O</text>
      <path d="M14 18 h18 M14 36 h18 M14 54 h18 M88 18 h18 M88 36 h18 M88 54 h18" stroke="#bac3d1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <path class="signal-neutral" d="M156 154 H184"/>

    <g transform="translate(184 86)">
      <rect class="transceiver" x="0" y="0" width="270" height="154" rx="14"/>
      <text class="component-title" x="135" y="29" text-anchor="middle">Transmit transceiver</text>
      <text class="micro-label" x="135" y="49" text-anchor="middle">electrical to optical conversion</text>

      <rect class="active" x="18" y="70" width="66" height="38" rx="7"/>
      <text class="component-label active-text" x="51" y="94" text-anchor="middle">DSP</text>

      <rect class="active" x="96" y="70" width="74" height="38" rx="7"/>
      <text class="component-label active-text" x="133" y="88" text-anchor="middle">laser</text>
      <text class="component-label active-text" x="133" y="102" text-anchor="middle">driver</text>

      <rect class="aging" x="182" y="70" width="70" height="38" rx="7"/>
      <text class="component-label aging-text" x="217" y="94" text-anchor="middle">laser</text>

      <rect class="aging" x="18" y="116" width="112" height="28" rx="7"/>
      <text class="component-label aging-text" x="74" y="135" text-anchor="middle">modulator</text>

      <rect class="fiber" x="142" y="116" width="110" height="28" rx="7"/>
      <text class="component-label fiber-text" x="197" y="135" text-anchor="middle">connector</text>
    </g>

    <path class="signal-optical" d="M454 154 H490"/>

    <g transform="translate(490 107)">
      <rect class="fiber" x="0" y="0" width="160" height="96" rx="15"/>
      <text class="component-title fiber-text" x="80" y="30" text-anchor="middle">Fiber span</text>
      <path d="M24 58 C48 38, 72 78, 96 58 S136 42, 136 58" stroke="url(#fiber-glow)" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="58" r="9" fill="#e8f5ff" stroke="#1677bd" stroke-width="2"/>
      <circle cx="140" cy="58" r="9" fill="#e8f5ff" stroke="#1677bd" stroke-width="2"/>
      <text class="micro-label" x="80" y="83" text-anchor="middle">medium + mating interfaces</text>
    </g>

    <path class="signal-optical" d="M650 154 H676"/>

    <g transform="translate(676 86)">
      <rect class="transceiver" x="0" y="0" width="270" height="154" rx="14"/>
      <text class="component-title" x="135" y="29" text-anchor="middle">Receive transceiver</text>
      <text class="micro-label" x="135" y="49" text-anchor="middle">optical to electrical conversion</text>

      <rect class="fiber" x="18" y="70" width="82" height="38" rx="7"/>
      <text class="component-label fiber-text" x="59" y="94" text-anchor="middle">connector</text>

      <rect class="aging" x="112" y="70" width="80" height="38" rx="7"/>
      <text class="component-label aging-text" x="152" y="88" text-anchor="middle">photo-</text>
      <text class="component-label aging-text" x="152" y="102" text-anchor="middle">detector</text>

      <rect class="active" x="204" y="70" width="48" height="38" rx="7"/>
      <text class="component-label active-text" x="228" y="94" text-anchor="middle">TIA</text>

      <rect class="active" x="18" y="116" width="116" height="28" rx="7"/>
      <text class="component-label active-text" x="76" y="135" text-anchor="middle">retimer / CDR</text>

      <rect class="active" x="146" y="116" width="106" height="28" rx="7"/>
      <text class="component-label active-text" x="199" y="135" text-anchor="middle">Rx DSP</text>
    </g>

    <path class="signal-neutral" d="M946 154 H964"/>

    <g transform="translate(964 118)">
      <rect class="endpoint" x="0" y="0" width="96" height="72" rx="13"/>
      <text class="endpoint-title" x="48" y="32" text-anchor="middle">Switch</text>
      <text class="endpoint-subtitle" x="48" y="52" text-anchor="middle">electrical I/O</text>
      <path d="M12 18 h15 M12 36 h15 M12 54 h15 M69 18 h15 M69 36 h15 M69 54 h15" stroke="#bac3d1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="translate(48 276)">
      <text class="small-label" x="0" y="0">Reliability surface shifts from mostly passive cable quality to powered, thermal, optical aging, and connector cleanliness concerns.</text>
    </g>
  </g>

  <g transform="translate(132 792)">
    <rect class="footer" x="0" y="-38" width="936" height="76" rx="14"/>

    <rect class="passive" x="74" y="-26" width="16" height="16" rx="4"/>
    <text class="footer-strong" x="100" y="-13">Passive medium</text>

    <rect class="active" x="360" y="-26" width="16" height="16" rx="4"/>
    <text class="footer-strong" x="386" y="-13">Powered electronics</text>

    <rect class="aging" x="648" y="-26" width="16" height="16" rx="4"/>
    <text class="footer-strong" x="674" y="-13">Optical components</text>

    <rect class="fiber" x="244" y="10" width="16" height="16" rx="4"/>
    <text class="footer-strong" x="270" y="23">Fiber/connectors</text>

    <path d="M552 18 H604" class="signal-neutral"/>
    <text class="footer-text" x="622" y="23">Signal path</text>
  </g>
</svg>
