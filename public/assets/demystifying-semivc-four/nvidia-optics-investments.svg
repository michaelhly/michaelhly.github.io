<svg width="1100" height="680" viewBox="0 0 1100 680" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Nvidia's Bets on Optics</title>
  <desc>
    A table of Nvidia's 2026 investments in the optical supply chain. Two billion dollars each into Lumentum, Coherent, and Marvell, up to 3.2 billion dollars into Corning warrants, and participation in Ayar Labs' 500 million dollar Series E.
  </desc>

  <defs>
    <filter id="soft-shadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#172033" flood-opacity="0.10"/>
    </filter>
  </defs>

  <style>
    svg {
      background: #f7f9fc;
      color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .page-bg {
      fill: #f7f9fc;
    }

    .title {
      fill: #111827;
      font-size: 34px;
      font-weight: 760;
    }

    .subtitle {
      fill: #596272;
      font-size: 16px;
      font-weight: 450;
    }

    .eyebrow {
      fill: #596272;
      font-size: 12px;
      font-weight: 700;
    }

    .panel {
      fill: #ffffff;
      stroke: #d8dde7;
      stroke-width: 1.2;
      filter: url(#soft-shadow);
    }

    .colhead {
      fill: #596272;
      font-size: 12px;
      font-weight: 700;
    }

    .head-rule {
      stroke: #d8dde7;
      stroke-width: 1.2;
    }

    .company {
      fill: #111827;
      font-size: 16px;
      font-weight: 740;
    }

    .cell-main {
      fill: #202938;
      font-size: 14px;
      font-weight: 600;
    }

    .cell-sub {
      fill: #667085;
      font-size: 13.5px;
      font-weight: 480;
    }

    .row-sep {
      stroke: #e7ebf2;
      stroke-width: 1;
    }

    .footnote {
      fill: #6b7280;
      font-size: 11px;
      font-weight: 520;
    }
  </style>

  <rect class="page-bg" width="1100" height="680" rx="26"/>

  <text class="eyebrow" x="70" y="54">THE SUCCESSION PLAN</text>
  <text class="title" x="70" y="92">Nvidia's Bets on Optics</text>
  <text class="subtitle" x="70" y="122">Roughly $6.5 billion into the optical supply chain since March 2026, past $9 billion if warrants are exercised in full.</text>

  <rect class="panel" x="56" y="156" width="988" height="456" rx="18"/>

  <text class="colhead" x="88" y="196">COMPANY</text>
  <text class="colhead" x="210" y="196">AMOUNT</text>
  <text class="colhead" x="460" y="196">PRICE PER SHARE</text>
  <text class="colhead" x="640" y="196">ANNOUNCED</text>
  <text class="colhead" x="750" y="196">ROLE IN THE CHAIN</text>
  <path class="head-rule" d="M80 210 H1020"/>

  <!-- Lumentum -->
  <text class="company" x="88" y="254">Lumentum</text>
  <text class="cell-main" x="210" y="252">$2B convertible preferred</text>
  <text class="cell-main" x="460" y="252">$695.31</text>
  <text class="cell-main" x="640" y="252">Mar 2026</text>
  <text class="cell-sub" x="750" y="252">High-power external lasers, expected sole</text>
  <text class="cell-sub" x="750" y="272">supplier for Nvidia's initial CPO switch</text>
  <text class="cell-sub" x="750" y="292">shipments</text>

  <path class="row-sep" d="M80 310 H1020"/>

  <!-- Coherent -->
  <text class="company" x="88" y="342">Coherent</text>
  <text class="cell-main" x="210" y="340">$2B common stock</text>
  <text class="cell-main" x="460" y="340">$256.80</text>
  <text class="cell-main" x="640" y="340">Mar 2026</text>
  <text class="cell-sub" x="750" y="340">Lasers again, expected to enter as a</text>
  <text class="cell-sub" x="750" y="360">second supplier in late 2026</text>

  <path class="row-sep" d="M80 382 H1020"/>

  <!-- Marvell -->
  <text class="company" x="88" y="414">Marvell</text>
  <text class="cell-main" x="210" y="412">$2B convertible preferred</text>
  <text class="cell-main" x="460" y="412">$91.84</text>
  <text class="cell-sub" x="460" y="432">conversion price</text>
  <text class="cell-main" x="640" y="412">Mar 2026</text>
  <text class="cell-sub" x="750" y="412">Silicon photonics and networking silicon,</text>
  <text class="cell-sub" x="750" y="432">bundled with NVLink Fusion</text>

  <path class="row-sep" d="M80 454 H1020"/>

  <!-- Corning -->
  <text class="company" x="88" y="486">Corning</text>
  <text class="cell-main" x="210" y="484">$500M for warrants, rising to</text>
  <text class="cell-main" x="210" y="504">$3.2B if exercised in full</text>
  <text class="cell-main" x="460" y="484">$180.00</text>
  <text class="cell-sub" x="460" y="504">warrant strike</text>
  <text class="cell-main" x="640" y="484">May 2026</text>
  <text class="cell-sub" x="750" y="484">The fiber itself, alongside a partnership</text>
  <text class="cell-sub" x="750" y="504">funding three new US plants</text>

  <path class="row-sep" d="M80 532 H1020"/>

  <!-- Ayar Labs -->
  <text class="company" x="88" y="564">Ayar Labs</text>
  <text class="cell-main" x="210" y="562">Joined a $500M Series E</text>
  <text class="cell-main" x="460" y="562">$3.75B post-money</text>
  <text class="cell-sub" x="460" y="582">valuation</text>
  <text class="cell-main" x="640" y="562">Mar 2026</text>
  <text class="cell-sub" x="750" y="562">Optical I/O chiplet startup</text>

  <text class="footnote" x="550" y="650" text-anchor="middle">Terms as announced by the companies, with supplier roles per SemiAnalysis reporting.</text>
</svg>
