<svg width="1100" height="620" viewBox="0 0 1100 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Rebuilding Bits</title>
  <desc>
    A plain-language diagram showing a weak, smeared electrical signal entering a digital signal processor. Inside the processor, the signal is reshaped, timing is recovered, and each bit is decided as a zero or one. A clean digital bit stream exits toward the laser driver.
  </desc>

  <defs>
    <filter id="soft-shadow" x="-8%" y="-12%" width="116%" height="132%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#172033" flood-opacity="0.10"/>
    </filter>

    <marker id="arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.4 L8 5 L2 8.6" fill="none" stroke="#5f6675" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.4 L8 5 L2 8.6" fill="none" stroke="#c68116" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <marker id="arrow-clean" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M2 1.4 L8 5 L2 8.6" fill="none" stroke="#13916f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>

    <linearGradient id="signal-fade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#c68116" stop-opacity="0.95"/>
      <stop offset="0.58" stop-color="#c68116" stop-opacity="0.52"/>
      <stop offset="1" stop-color="#c68116" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <style>
    svg {
      background: #f7f9fc;
      color: #172033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    .page-bg {
      fill: #f7f9fc;
    }

    .title {
      fill: #111827;
      font-size: 34px;
      font-weight: 760;
    }

    .subtitle {
      fill: #596272;
      font-size: 16px;
      font-weight: 450;
    }

    .eyebrow {
      fill: #596272;
      font-size: 12px;
      font-weight: 700;
    }

    .panel {
      fill: #ffffff;
      stroke: #d8dde7;
      stroke-width: 1.2;
      filter: url(#soft-shadow);
    }

    .block-title {
      fill: #202938;
      font-size: 18px;
      font-weight: 740;
    }

    .block-subtitle {
      fill: #667085;
      font-size: 13px;
      font-weight: 520;
    }

    .active-box {
      fill: #fff3d6;
      stroke: #c68116;
      stroke-width: 1.2;
    }

    .active-text {
      fill: #8b5610;
    }

    .clean-box {
      fill: #dcf8ed;
      stroke: #13916f;
      stroke-width: 1.2;
    }

    .clean-text {
      fill: #08745c;
    }

    .muted-box {
      fill: #f8fafc;
      stroke: #aeb7c6;
      stroke-width: 1.1;
    }

    .chip {
      fill: #fbfcff;
      stroke: #9aa5b8;
      stroke-width: 1.2;
      stroke-dasharray: 6 5;
    }

    .step-title {
      font-size: 13px;
      font-weight: 740;
    }

    .step-copy {
      fill: #667085;
      font-size: 11px;
      font-weight: 560;
    }

    .label {
      fill: #4b5563;
      font-size: 12px;
      font-weight: 620;
    }

    .tiny {
      fill: #6b7280;
      font-size: 10px;
      font-weight: 620;
    }

    .flow-neutral {
      stroke: #697386;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow-neutral);
    }

    .flow-active {
      stroke: #c68116;
      stroke-width: 2.2;
      fill: none;
      marker-end: url(#arrow-active);
    }

    .flow-clean {
      stroke: #13916f;
      stroke-width: 2.2;
      fill: none;
      marker-end: url(#arrow-clean);
    }

    .wave-faint {
      stroke: url(#signal-fade);
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
    }

    .wave-clean {
      stroke: #13916f;
      stroke-width: 4;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .threshold {
      stroke: #9aa5b8;
      stroke-width: 1.2;
      stroke-dasharray: 5 5;
    }
  </style>

  <rect class="page-bg" width="1100" height="620"/>

  <text class="eyebrow" x="70" y="54">DIGITAL SIGNAL PROCESSOR</text>
  <text class="title" x="70" y="92">Rebuilding Bits</text>
  <text class="subtitle" x="70" y="122">A weak board signal goes in; the processor reshapes it into clean zeros and ones for the laser.</text>

  <rect class="panel" x="56" y="164" width="988" height="360" rx="18"/>

  <g transform="translate(92 226)">
    <rect class="muted-box" x="0" y="0" width="190" height="210" rx="14"/>
    <text class="block-title" x="95" y="36" text-anchor="middle">Board signal</text>
    <text class="block-subtitle" x="95" y="58" text-anchor="middle">smeared and faint</text>

    <path class="threshold" d="M28 126 H162"/>
    <path class="wave-faint" d="M28 126 C42 78, 56 174, 70 126 S98 78, 112 126 S140 174, 154 126"/>
    <circle cx="44" cy="97" r="4" fill="#c68116" opacity="0.75"/>
    <circle cx="78" cy="139" r="4" fill="#c68116" opacity="0.45"/>
    <circle cx="112" cy="103" r="4" fill="#c68116" opacity="0.55"/>
    <circle cx="146" cy="134" r="4" fill="#c68116" opacity="0.30"/>

    <text class="label" x="95" y="184" text-anchor="middle">hard to tell 0 from 1</text>
  </g>

  <path class="flow-active" d="M301 331 H323"/>

  <g transform="translate(342 194)">
    <rect class="chip" x="0" y="0" width="416" height="274" rx="16"/>
    <text class="block-title" x="208" y="35" text-anchor="middle">Digital signal processor</text>
    <text class="block-subtitle" x="208" y="57" text-anchor="middle">rebuilds the bit stream before optical conversion</text>

    <g transform="translate(24 88)">
      <rect class="active-box" x="0" y="0" width="108" height="88" rx="10"/>
      <text class="step-title active-text" x="54" y="27" text-anchor="middle">1. Reshape</text>
      <text class="step-copy" x="54" y="50" text-anchor="middle">undo board</text>
      <text class="step-copy" x="54" y="66" text-anchor="middle">smear</text>
    </g>

    <path class="flow-neutral" d="M140 132 H160"/>

    <g transform="translate(164 88)">
      <rect class="active-box" x="0" y="0" width="108" height="88" rx="10"/>
      <text class="step-title active-text" x="54" y="27" text-anchor="middle">2. Find timing</text>
      <text class="step-copy" x="54" y="50" text-anchor="middle">line samples</text>
      <text class="step-copy" x="54" y="66" text-anchor="middle">with bit slots</text>
    </g>

    <path class="flow-neutral" d="M280 132 H300"/>

    <g transform="translate(304 88)">
      <rect class="active-box" x="0" y="0" width="88" height="88" rx="10"/>
      <text class="step-title active-text" x="44" y="27" text-anchor="middle">3. Decide</text>
      <text class="step-copy" x="44" y="50" text-anchor="middle">pick</text>
      <text class="step-copy" x="44" y="66" text-anchor="middle">0 or 1</text>
    </g>

    <g transform="translate(52 208)">
      <text class="tiny" x="-18" y="0">faint input</text>
      <path d="M56 -5 C66 -15, 76 5, 86 -5 S106 -15, 116 -5" stroke="#c68116" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M138 -5 H168" stroke="#697386" stroke-width="1.4" marker-end="url(#arrow-neutral)" fill="none"/>
      <text class="tiny clean-text" x="176" y="0">rebuilt bits</text>
      <path class="wave-clean" d="M252 8 V-18 H268 V8 H284 V-18 H300 V8 H316"/>
    </g>
  </g>

  <path class="flow-clean" d="M772 331 H794"/>

  <g transform="translate(808 226)">
    <rect class="clean-box" x="0" y="0" width="200" height="210" rx="14"/>
    <text class="block-title clean-text" x="100" y="36" text-anchor="middle">Clean bits out</text>
    <text class="block-subtitle" x="100" y="58" text-anchor="middle">ready for laser driver</text>

    <path d="M36 84 V122 M32 84 H40 M32 122 H40" stroke="#8fb3a7" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <text class="tiny clean-text" x="24" y="88" text-anchor="middle">1</text>
    <text class="tiny clean-text" x="24" y="126" text-anchor="middle">0</text>
    <path class="wave-clean" d="M48 122 V84 H70 V122 H92 V84 H114 V122 H136 V84 H158 V122 H180"/>
    <text class="label" x="100" y="184" text-anchor="middle">clear zeros and ones</text>
  </g>

  <text class="label" x="550" y="566" text-anchor="middle">The DSP alone burns nearly half the module's power, six to seven watts in an 800G transceiver</text>
</svg>
