<svg width="100%" viewBox="0 0 680 372" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Outline of a power plant, showing the three layers that answer a change in demand</title>
<desc>Steam from the boiler passes a governor valve into high, intermediate and low pressure turbine stages, all mounted on one shaft with the generator and exciter, which feeds the grid. Three layers answer a change in demand. Inertia in the first fraction of a second, as the spinning mass gives up kinetic energy. The governor over the next several seconds, opening the steam valve. Dispatch minutes later, as other plants cover the new load. The short shaft sections between the masses are what twist.</desc>
<style>
  .ink   { fill: rgb(11,11,11); }
  .gray  { fill: rgb(82,81,78); }
  .red   { fill: rgb(163,45,45); }
  .h     { font: 600 15px anthropic-sans, -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .sub   { font: 400 12px anthropic-sans, -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .lbl   { font: 500 11px anthropic-sans, -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .lgd   { font: 600 12px anthropic-sans, -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .lgdd  { font: 400 12px anthropic-sans, -apple-system, "system-ui", "Segoe UI", sans-serif; }
  .badge { font: 600 11px anthropic-sans, -apple-system, "system-ui", "Segoe UI", sans-serif; fill: rgb(255,255,255); }
  .steel { fill: rgb(232,231,228); stroke: rgb(82,81,78); stroke-width: 1.25; }
  .shaft { stroke: rgb(120,119,116); stroke-width: 8; }
  .lead  { stroke: rgb(82,81,78); stroke-width: 1; stroke-dasharray: 2 2; fill: none; }
  .wire  { stroke: rgb(11,11,11); stroke-width: 1.5; fill: none; }
  .valve { fill: rgb(250,238,218); stroke: rgb(133,79,11); stroke-width: 1.5; }
  .twist { fill: rgb(163,45,45); }
  .bdot  { fill: rgb(11,11,11); }
</style>

<text class="h ink" x="0" y="16">One shaft, three answers</text>
<text class="sub gray" x="0" y="34">Steam pushes on one end, the grid pulls on the other, and the shaft in between carries the difference.</text>

<!-- twist callout -->
<text class="lbl red" x="188" y="104">these short sections are what twist</text>
<path class="lead" d="M 262 110 L 270 164" style="stroke: rgb(163,45,45);"/>

<!-- electrical output to the grid -->
<path class="wire" d="M 427 143 L 427 105 L 606 105"/>
<g stroke="rgb(11,11,11)" stroke-width="1.5">
  <line x1="612" y1="98" x2="652" y2="98"/>
  <line x1="618" y1="105" x2="646" y2="105"/>
  <line x1="624" y1="112" x2="640" y2="112"/>
</g>
<text class="lbl gray" x="632" y="134" text-anchor="middle">To the grid</text>

<!-- steam supply -->
<rect class="steel" x="0" y="168" width="90" height="14"/>
<text class="lbl gray" x="0" y="199">Steam from the boiler</text>

<!-- shaft, drawn behind the masses -->
<line class="shaft" x1="90" y1="175" x2="552" y2="175"/>

<!-- shaft sections that twist -->
<g class="twist">
  <rect x="190" y="170" width="10" height="10"/>
  <rect x="265" y="170" width="10" height="10"/>
  <rect x="365" y="170" width="20" height="10"/>
  <rect x="470" y="170" width="15" height="10"/>
</g>

<!-- governor valve -->
<path class="valve" d="M 100 157 L 124 193 L 124 157 L 100 193 Z"/>
<text class="lbl ink" x="86" y="145">Governor valve</text>

<!-- turbine stages, growing as steam expands -->
<path class="steel" d="M 135 157 L 190 149 L 190 201 L 135 193 Z"/>
<path class="steel" d="M 200 149 L 265 139 L 265 211 L 200 201 Z"/>
<path class="steel" d="M 275 139 L 365 123 L 365 227 L 275 211 Z"/>
<text class="lbl ink" x="162" y="178" text-anchor="middle">HP</text>
<text class="lbl ink" x="232" y="178" text-anchor="middle">IP</text>
<text class="lbl ink" x="320" y="178" text-anchor="middle">LP</text>
<text class="lbl gray" x="250" y="245" text-anchor="middle">turbine stages</text>

<!-- generator -->
<rect class="steel" x="385" y="143" width="85" height="64"/>
<circle cx="427" cy="175" r="19" fill="rgb(255,255,255)" stroke="rgb(82,81,78)" stroke-width="1.25"/>
<path d="M 417 175 q 5 -9 10 0 q 5 9 10 0" fill="none" stroke="rgb(11,11,11)" stroke-width="1.5"/>
<text class="lbl gray" x="427" y="222" text-anchor="middle">generator</text>

<!-- exciter -->
<rect class="steel" x="485" y="160" width="40" height="30"/>
<text class="lbl gray" x="505" y="205" text-anchor="middle">exciter</text>

<!-- numbered anchors -->
<path class="lead" d="M 330 258 L 330 232"/>
<circle class="bdot" cx="330" cy="268" r="9"/>
<text class="badge" x="330" y="272" text-anchor="middle">1</text>

<path class="lead" d="M 112 133 L 112 155"/>
<circle class="bdot" cx="112" cy="123" r="9"/>
<text class="badge" x="112" y="127" text-anchor="middle">2</text>

<path class="lead" d="M 632 88 L 632 94"/>
<circle class="bdot" cx="632" cy="78" r="9"/>
<text class="badge" x="632" y="82" text-anchor="middle">3</text>

<!-- legend -->
<line x1="0" y1="292" x2="680" y2="292" stroke="rgb(210,209,206)" stroke-width="1"/>
<circle class="bdot" cx="9" cy="311" r="9"/>
<text class="badge" x="9" y="315" text-anchor="middle">1</text>
<text x="26" y="315"><tspan class="lgd ink">Inertia, the first fraction of a second.</tspan><tspan class="lgdd gray" dx="6">The spinning mass gives up kinetic energy and the machine slows.</tspan></text>

<circle class="bdot" cx="9" cy="337" r="9"/>
<text class="badge" x="9" y="341" text-anchor="middle">2</text>
<text x="26" y="341"><tspan class="lgd ink">The governor, seconds.</tspan><tspan class="lgdd gray" dx="6">The lost speed opens the steam valve until the turbine pushes as hard as the grid pulls.</tspan></text>

<circle class="bdot" cx="9" cy="363" r="9"/>
<text class="badge" x="9" y="367" text-anchor="middle">3</text>
<text x="26" y="367"><tspan class="lgd ink">Dispatch, minutes.</tspan><tspan class="lgdd gray" dx="6">Other plants come up to cover the new load and hand this one back a steady setpoint.</tspan></text>
</svg>
