<svg width="100%" viewBox="0 0 880 580" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'system-ui', 'Segoe UI', sans-serif">
<title>How a training loop becomes turbine stress</title>
<desc>Synchronized GPU work creates fast demand pulses. Plant controls lag behind those pulses, leaving a torque mismatch. The rotor absorbs the mismatch by twisting, and near a natural torsional frequency the small twists build into fatigue stress.</desc>
<defs>
<marker id="tick-arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
<path d="M 0 0 L 9 3.5 L 0 7 z" fill="#898781"/>
</marker>
<marker id="stress-arrow" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
<path d="M 0 0 L 9 3.5 L 0 7 z" fill="#a32d2d"/>
</marker>
</defs>

<rect x="0" y="0" width="880" height="580" fill="#ffffff"/>

<text x="28" y="34" fill="#0b0b0b" font-size="16" font-weight="500">How a training loop becomes turbine stress</text>
<text x="28" y="56" fill="#52514e" font-size="12">Synchronized GPU work creates fast demand pulses, plant controls lag, and the rotor absorbs the mismatch by twisting.</text>

<rect x="28" y="82" width="824" height="132" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-opacity="0.15" stroke-width="0.5"/>
<text x="50" y="112" fill="#0b0b0b" font-size="14" font-weight="500">1. Training demand pulses</text>
<text x="50" y="132" fill="#52514e" font-size="12">GPUs ramp together after</text>
<text x="50" y="148" fill="#52514e" font-size="12">each synchronization barrier.</text>
<line x1="270" y1="180" x2="810" y2="180" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="270" y1="110" x2="270" y2="180" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<path d="M270 174 L296 174 L296 118 L336 118 L336 174 L366 174 L366 118 L407 118 L407 174 L438 174 L438 118 L479 118 L479 174 L510 174 L510 118 L552 118 L552 174 L583 174 L583 118 L624 118 L624 174 L655 174 L655 118 L696 118 L696 174 L727 174 L727 118 L768 118 L768 174 L808 174" fill="none" stroke="#BA7517" stroke-width="2" stroke-linejoin="round"/>
<rect x="94" y="156" width="36" height="30" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<rect x="138" y="156" width="36" height="30" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<rect x="182" y="156" width="36" height="30" rx="4" fill="#faeeda" stroke="#854f0b" stroke-width="0.5"/>
<line x1="226" y1="171" x2="258" y2="171" stroke="#898781" stroke-width="1" marker-end="url(#tick-arrow)"/>
<text x="305" y="202" fill="#52514e" font-size="12">time</text>
<text x="836" y="106" text-anchor="end" fill="#52514e" font-size="12">load rises and falls in formation</text>

<rect x="28" y="238" width="824" height="132" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-opacity="0.15" stroke-width="0.5"/>
<text x="50" y="268" fill="#0b0b0b" font-size="14" font-weight="500">2. Mechanical response lags</text>
<text x="50" y="288" fill="#52514e" font-size="12">The grid changes its pull before</text>
<text x="50" y="304" fill="#52514e" font-size="12">the turbine changes its push.</text>
<line x1="270" y1="336" x2="810" y2="336" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="270" y1="266" x2="270" y2="336" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<path d="M296 276 L336 276 L336 290 C324 292 304 304 300 324 L296 328 Z M366 276 L407 276 L407 290 C395 292 374 304 370 324 L366 328 Z M438 276 L479 276 L479 290 C467 292 446 304 442 324 L438 328 Z M510 276 L552 276 L552 290 C540 292 518 304 514 324 L510 328 Z M583 276 L624 276 L624 290 C612 292 591 304 587 324 L583 328 Z M655 276 L696 276 L696 290 C684 292 663 304 659 324 L655 328 Z M727 276 L768 276 L768 290 C756 292 735 304 731 324 L727 328 Z" fill="#fcebeb" stroke="#a32d2d" stroke-opacity="0.4" stroke-width="0.5"/>
<path d="M270 329 L296 329 L296 276 L336 276 L336 329 L366 329 L366 276 L407 276 L407 329 L438 329 L438 276 L479 276 L479 329 L510 329 L510 276 L552 276 L552 329 L583 329 L583 276 L624 276 L624 329 L655 329 L655 276 L696 276 L696 329 L727 329 L727 276 L768 276 L768 329 L808 329" fill="none" stroke="#BA7517" stroke-width="2" stroke-linejoin="round"/>
<path d="M270 326 L300 325 C306 300 328 289 340 288 C348 312 362 322 370 324 C376 300 398 289 411 288 C419 312 434 322 442 324 C448 300 470 289 483 288 C491 312 506 322 514 324 C520 300 543 289 556 288 C564 312 579 322 587 324 C593 300 615 289 628 288 C636 312 651 322 659 324 C665 300 687 289 700 288 C708 312 723 322 731 324 C737 300 759 289 772 288 C780 312 796 322 808 325" fill="none" stroke="#0f6e56" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="106" y="312" width="104" height="34" rx="4" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="118" y="334" fill="#085041" font-size="12">governor lag</text>
<line x1="226" y1="329" x2="258" y2="329" stroke="#898781" stroke-width="1" marker-end="url(#tick-arrow)"/>
<text x="836" y="260" text-anchor="end" fill="#52514e" font-size="12">red area = mismatch absorbed by rotor</text>

<rect x="28" y="394" width="824" height="158" rx="6" fill="#ffffff" stroke="#0b0b0b" stroke-opacity="0.15" stroke-width="0.5"/>
<text x="50" y="424" fill="#0b0b0b" font-size="14" font-weight="500">3. Rotor absorbs the mismatch by twisting</text>
<text x="50" y="446" fill="#52514e" font-size="12">Near a natural torsional frequency,</text>
<text x="50" y="462" fill="#52514e" font-size="12">small twists build into fatigue stress.</text>
<line x1="226" y1="474" x2="258" y2="474" stroke="#898781" stroke-width="1" marker-end="url(#tick-arrow)"/>
<g transform="translate(280 0)">
<rect x="42" y="460" width="350" height="28" rx="14" fill="#f2f1ee" stroke="#898781" stroke-width="0.5"/>
<ellipse cx="42" cy="474" rx="20" ry="45" fill="#e6e4de" stroke="#898781" stroke-width="0.5"/>
<ellipse cx="392" cy="474" rx="20" ry="45" fill="#e6e4de" stroke="#898781" stroke-width="0.5"/>
<rect x="188" y="448" width="58" height="52" rx="6" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<path d="M139 445 C173 416 219 416 253 445" fill="none" stroke="#a32d2d" stroke-width="2" stroke-linecap="round" marker-end="url(#stress-arrow)"/>
<path d="M299 503 C265 532 219 532 185 503" fill="none" stroke="#a32d2d" stroke-width="2" stroke-linecap="round" marker-end="url(#stress-arrow)"/>
<path d="M48 525 C94 502 128 502 174 525 S252 548 298 525 S360 502 392 525" fill="none" stroke="#a32d2d" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
</g>
<g>
<path d="M704 446 C712 437 722 437 730 446" fill="none" stroke="#a32d2d" stroke-width="2" stroke-linecap="round" marker-end="url(#stress-arrow)"/>
<text x="742" y="450" fill="#0b0b0b" font-size="14" font-weight="500">twisting stress</text>
<rect x="710" y="474" width="12" height="12" rx="3" fill="#fcebeb" stroke="#a32d2d" stroke-width="0.5"/>
<text x="742" y="484" fill="#0b0b0b" font-size="14" font-weight="500">fatigue zone</text>
<line x1="704" y1="514" x2="730" y2="514" stroke="#a32d2d" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 5"/>
<text x="742" y="518" fill="#0b0b0b" font-size="14" font-weight="500">torsional mode</text>
</g>

<path d="M450 214 L450 232" fill="none" stroke="#898781" stroke-width="1" marker-end="url(#tick-arrow)"/>
<path d="M450 370 L450 388" fill="none" stroke="#898781" stroke-width="1" marker-end="url(#tick-arrow)"/>
</svg>
