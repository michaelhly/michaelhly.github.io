<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img" aria-label="Diagram showing synchronized AI training load pulses becoming turbine shaft stress. Governor lag leaves a torque mismatch that the rotor absorbs by twisting, with torsional resonance risk.">
  <defs>
    <marker id="stress-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path class="arrowhead" d="M 0 0 L 10 4 L 0 8 z" fill="#5b6675"/>
    </marker>
    <marker id="red-arrow" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <path class="arrowhead-red" d="M 0 0 L 10 4 L 0 8 z" fill="#e23d3d"/>
    </marker>
    <linearGradient id="shaft-gradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8c96a4"/>
      <stop offset="0.5" stop-color="#e5ebf2"/>
      <stop offset="1" stop-color="#798493"/>
    </linearGradient>
    <style>
      .ink { fill: #17212f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #5b6675; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 18px; font-weight: 750; }
      .caption { font-size: 13px; }
      .label { font-size: 13px; font-weight: 650; }
      .small { font-size: 12px; }
      .key-text { fill: #17212f; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 600; }
      .panel { fill: #f7f9fc; stroke: #ccd5e2; stroke-width: 1.2; }
      .axis { stroke: #ccd5e2; stroke-width: 1.2; }
      .training { fill: none; stroke: #1684f8; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .governor { fill: none; stroke: #1d9a77; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
      .lag { fill: rgba(226, 61, 61, 0.18); stroke: rgba(226, 61, 61, 0.42); stroke-width: 1; }
      .arrow { stroke: #5b6675; stroke-width: 1.6; fill: none; marker-end: url(#stress-arrow); }
      .stress-arrow { stroke: #e23d3d; stroke-width: 3; fill: none; marker-end: url(#red-arrow); }
      .shaft { fill: url(#shaft-gradient); stroke: #8792a2; stroke-width: 1.4; }
      .ring { fill: #b6bfca; stroke: #788391; stroke-width: 1.5; }
      .hot { fill: rgba(226, 61, 61, 0.16); stroke: #e23d3d; stroke-width: 2.5; }
      .resonance { fill: none; stroke: #f2a124; stroke-width: 2.8; stroke-linecap: round; stroke-dasharray: 7 7; }
      .chip { fill: rgba(22, 132, 248, 0.12); stroke: #1684f8; stroke-width: 1.5; }
      .plant { fill: rgba(29, 154, 119, 0.12); stroke: #1d9a77; stroke-width: 1.5; }
      .bg { fill: #ffffff; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0f1620; }
        .ink { fill: #e8edf4; }
        .muted { fill: #9aa7b8; }
        .key-text { fill: #e8edf4; }
        .panel { fill: #16202e; stroke: #2b3a4e; }
        .axis { stroke: #33445a; }
        .arrow { stroke: #93a1b3; }
        .arrowhead { fill: #93a1b3; }
        .arrowhead-red { fill: #f25555; }
        .training { stroke: #4da3ff; }
        .governor { stroke: #35c39a; }
        .lag { fill: rgba(255, 99, 99, 0.22); stroke: rgba(255, 99, 99, 0.5); }
        .stress-arrow { stroke: #f25555; }
        .hot { fill: rgba(242, 85, 85, 0.2); stroke: #f25555; }
        .chip { stroke: #4da3ff; }
        .plant { stroke: #35c39a; }
      }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="880" height="580"/>

  <text class="ink title" x="28" y="34">How a training loop becomes turbine stress</text>
  <text class="muted caption" x="28" y="58">Synchronized GPU work creates fast demand pulses; plant controls lag; the rotor absorbs the mismatch by twisting.</text>

  <rect class="panel" x="28" y="82" width="824" height="132" rx="8"/>
  <text class="ink label" x="50" y="110">1. Training demand pulses</text>
  <text class="muted small" x="50" y="130">GPUs ramp together after</text>
  <text class="muted small" x="50" y="146">each synchronization barrier.</text>
  <line class="axis" x1="270" y1="180" x2="810" y2="180"/>
  <line class="axis" x1="270" y1="110" x2="270" y2="180"/>
  <path class="training" d="M270 174 L296 174 L296 118 L336 118 L336 174 L366 174 L366 118 L407 118 L407 174 L438 174 L438 118 L479 118 L479 174 L510 174 L510 118 L552 118 L552 174 L583 174 L583 118 L624 118 L624 174 L655 174 L655 118 L696 118 L696 174 L727 174 L727 118 L768 118 L768 174 L808 174"/>
  <rect class="chip" x="94" y="156" width="36" height="30" rx="5"/>
  <rect class="chip" x="138" y="156" width="36" height="30" rx="5"/>
  <rect class="chip" x="182" y="156" width="36" height="30" rx="5"/>
  <line class="arrow" x1="226" y1="171" x2="258" y2="171"/>
  <text class="muted small" x="305" y="202">time</text>
  <text class="muted small" x="836" y="105" text-anchor="end">load rises and falls in formation</text>

  <rect class="panel" x="28" y="238" width="824" height="132" rx="8"/>
  <text class="ink label" x="50" y="266">2. Mechanical response lags</text>
  <text class="muted small" x="50" y="286">The grid changes its pull before</text>
  <text class="muted small" x="50" y="302">the turbine changes its push.</text>
  <line class="axis" x1="270" y1="336" x2="810" y2="336"/>
  <line class="axis" x1="270" y1="266" x2="270" y2="336"/>
  <path class="lag" d="M296 276 L336 276 L336 290 C324 292 304 304 300 324 L296 328 Z M366 276 L407 276 L407 290 C395 292 374 304 370 324 L366 328 Z M438 276 L479 276 L479 290 C467 292 446 304 442 324 L438 328 Z M510 276 L552 276 L552 290 C540 292 518 304 514 324 L510 328 Z M583 276 L624 276 L624 290 C612 292 591 304 587 324 L583 328 Z M655 276 L696 276 L696 290 C684 292 663 304 659 324 L655 328 Z M727 276 L768 276 L768 290 C756 292 735 304 731 324 L727 328 Z"/>
  <path class="training" d="M270 329 L296 329 L296 276 L336 276 L336 329 L366 329 L366 276 L407 276 L407 329 L438 329 L438 276 L479 276 L479 329 L510 329 L510 276 L552 276 L552 329 L583 329 L583 276 L624 276 L624 329 L655 329 L655 276 L696 276 L696 329 L727 329 L727 276 L768 276 L768 329 L808 329"/>
  <path class="governor" d="M270 326 L300 325 C306 300 328 289 340 288 C348 312 362 322 370 324 C376 300 398 289 411 288 C419 312 434 322 442 324 C448 300 470 289 483 288 C491 312 506 322 514 324 C520 300 543 289 556 288 C564 312 579 322 587 324 C593 300 615 289 628 288 C636 312 651 322 659 324 C665 300 687 289 700 288 C708 312 723 322 731 324 C737 300 759 289 772 288 C780 312 796 322 808 325"/>
  <rect class="plant" x="106" y="312" width="104" height="34" rx="5"/>
  <text class="muted small" x="118" y="334">governor lag</text>
  <line class="arrow" x1="226" y1="329" x2="258" y2="329"/>
  <text class="muted small" x="836" y="258" text-anchor="end">red area = mismatch absorbed by rotor</text>

  <rect class="panel" x="28" y="394" width="824" height="158" rx="8"/>
  <text class="ink label" x="50" y="422">3. Rotor absorbs the mismatch by twisting</text>
  <text class="muted small" x="50" y="444">Near a natural torsional frequency,</text>
  <text class="muted small" x="50" y="460">small twists build into fatigue stress.</text>
  <line class="arrow" x1="226" y1="474" x2="258" y2="474"/>
  <g transform="translate(280 0)">
    <rect class="shaft" x="42" y="460" width="350" height="28" rx="14"/>
    <ellipse class="ring" cx="42" cy="474" rx="20" ry="45"/>
    <ellipse class="ring" cx="392" cy="474" rx="20" ry="45"/>
    <rect class="hot" x="188" y="448" width="58" height="52" rx="8"/>
    <path class="stress-arrow" d="M139 445 C173 416 219 416 253 445"/>
    <path class="stress-arrow" d="M299 503 C265 532 219 532 185 503"/>
    <path class="resonance" d="M48 525 C94 502 128 502 174 525 S252 548 298 525 S360 502 392 525"/>
  </g>
  <g>
    <path class="stress-arrow" d="M714 438 C730 426 748 426 764 438"/>
    <text class="key-text" x="704" y="462">twisting stress</text>
    <rect class="hot" x="704" y="476" width="22" height="18" rx="4"/>
    <text class="key-text" x="736" y="490">fatigue zone</text>
    <line class="resonance" x1="704" y1="520" x2="728" y2="520"/>
    <text class="key-text" x="736" y="524">torsional mode</text>
  </g>

  <path class="arrow" d="M450 214 C450 224 450 228 450 238"/>
  <path class="arrow" d="M450 370 C450 380 450 384 450 394"/>
</svg>
