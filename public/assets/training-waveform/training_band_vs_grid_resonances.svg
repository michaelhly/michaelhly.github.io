<svg width="100%" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'system-ui', 'Segoe UI', sans-serif">
<title>Where the training band sits among the grid's resonant modes</title>
<desc>A log frequency axis from 0.1 to 100 hertz. A shaded column marks the band where training power swings concentrate, 0.2 to 3 hertz. Three bars mark the grid's resonant modes. Transmission line oscillations below 1 hertz and nearby generator oscillations from 1 to 2.5 hertz both fall inside the training band. Turbine shaft torsional modes start around 7 hertz, just above it.</desc>
<rect x="0" y="0" width="680" height="340" fill="#ffffff"/>
<text x="100" y="34" fill="#0b0b0b" font-size="16" font-weight="600">Where the training band sits among the grid's resonant modes</text>
<g transform="translate(0, 32)">
<rect x="152.2" y="42" width="203.8" height="216" rx="6" fill="#faeeda"/>
<text x="254.1" y="64" text-anchor="middle" fill="#633806" font-size="14" font-weight="600">Training power swings</text>
<text x="254.1" y="82" text-anchor="middle" fill="#854f0b" font-size="12">0.2 to 3 Hz</text>
<text x="100" y="118" font-size="13"><tspan fill="#0b0b0b" font-weight="500">Transmission lines</tspan><tspan fill="#52514e">  below 1 Hz</tspan></text>
<rect x="100" y="126" width="173.3" height="16" rx="4" fill="#a32d2d"/>
<text x="273.3" y="166" font-size="13"><tspan fill="#0b0b0b" font-weight="500">Nearby generators</tspan><tspan fill="#52514e">  1 to 2.5 Hz</tspan></text>
<rect x="273.3" y="174" width="69" height="16" rx="4" fill="#a32d2d"/>
<text x="419.8" y="196" font-size="13" fill="#0b0b0b" font-weight="500">Torsional modes for</text>
<text x="419.8" y="214" font-size="13"><tspan fill="#0b0b0b" font-weight="500">turbine-generator shafts</tspan><tspan fill="#52514e">  7 Hz and up</tspan></text>
<rect x="419.8" y="222" width="200.2" height="16" rx="4" fill="#a32d2d"/>
<line x1="100" y1="272" x2="620" y2="272" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="100" y1="272" x2="100" y2="278" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="152.2" y1="272" x2="152.2" y2="278" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="221.2" y1="272" x2="221.2" y2="278" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="273.3" y1="272" x2="273.3" y2="278" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="356" y1="272" x2="356" y2="278" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="419.8" y1="272" x2="419.8" y2="278" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="446.7" y1="272" x2="446.7" y2="278" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<line x1="620" y1="272" x2="620" y2="278" stroke="#0b0b0b" stroke-opacity="0.2" stroke-width="0.5"/>
<text x="100" y="294" text-anchor="middle" fill="#52514e" font-size="12">0.1</text>
<text x="152.2" y="294" text-anchor="middle" fill="#52514e" font-size="12">0.2</text>
<text x="221.2" y="294" text-anchor="middle" fill="#52514e" font-size="12">0.5</text>
<text x="273.3" y="294" text-anchor="middle" fill="#52514e" font-size="12">1</text>
<text x="356" y="294" text-anchor="middle" fill="#52514e" font-size="12">3</text>
<text x="419.8" y="294" text-anchor="middle" fill="#52514e" font-size="12">7</text>
<text x="446.7" y="294" text-anchor="middle" fill="#52514e" font-size="12">10</text>
<text x="620" y="294" text-anchor="middle" fill="#52514e" font-size="12">100 Hz</text>
</g>
</svg>
