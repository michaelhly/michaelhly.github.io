<svg width="100%" viewBox="0 0 680 461" role="img" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">
<title>High-end FC-BGA substrate market share, with a callout on the capital behind Ibiden's lead</title>
<desc>A pie chart of 2025 high-end FC-BGA substrate share: Ibiden 30 percent (pulled out and highlighted in Ibiden's corporate blue), Unimicron 22 percent, Others 25 percent, Shinko 15 percent, and AT&amp;S 8 percent, with the top four making up about 75 percent of output. An arrow runs from the Ibiden slice to a compact callout card: a METI supply-securing subsidy of up to 40.5 billion yen, roughly 260 million dollars, for the Ono plant approved April 2023 at under a third of project cost, and roughly 520 million dollars, or 81.0 billion yen, of customer advances received on Ibiden's balance sheet at March 31 2026, against 92.1 billion yen a year earlier. A closing strip notes this funds a 500 billion yen capex program targeting 2.5 times capacity by 2028.</desc>

<defs>
<marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#993C1D"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="461" rx="16" fill="#EBEDF2" stroke="#E2E3E8" stroke-width="1"/>

<!-- ===================== TITLE ===================== -->
<text x="32" y="38" font-size="16" font-weight="600" fill="#0b0b0b">High-End FC-BGA Substrate Share, 2025</text>
<text x="32" y="60" font-size="11.5" font-weight="400" fill="#89877f" letter-spacing="0.6">MARKET SHARE ESTIMATES  ·  TOP FOUR ≈ 75% OF OUTPUT</text>

<!-- ===================== PIE + LEGEND (left) ===================== -->
<g transform="translate(0,-30)">
<g stroke="#ffffff" stroke-width="2" stroke-linejoin="round">
<!-- Others 25% -->
<path d="M150 246 L58 246 A92 92 0 0 1 150 154 Z" fill="#e4e2db"/>
<!-- AT&S 8% -->
<path d="M150 246 L69.38 290.32 A92 92 0 0 1 58 246 Z" fill="#b2b0a8"/>
<!-- Shinko 15% -->
<path d="M150 246 L138.47 337.27 A92 92 0 0 1 69.38 290.32 Z" fill="#7c7a73"/>
<!-- Unimicron 22% -->
<path d="M150 246 L237.5 274.43 A92 92 0 0 1 138.47 337.27 Z" fill="#46443f"/>
<!-- Ibiden 30% — pulled out, in Ibiden corporate blue -->
<path d="M161.33 237.77 L161.33 145.77 A92 92 0 0 1 248.83 266.2 Z" fill="#003894"/>
</g>

<!-- in-slice values -->
<text x="206" y="200" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Ibiden</text>
<text x="206" y="216" text-anchor="middle" font-size="12.5" font-weight="500" fill="#ffffff">30%</text>
<text x="181" y="299" text-anchor="middle" font-size="12" font-weight="500" fill="#ffffff">22%</text>
<text x="117" y="298" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">15%</text>
<text x="94" y="264" text-anchor="middle" font-size="10.5" font-weight="500" fill="#2f2d2a">8%</text>
<text x="109" y="209" text-anchor="middle" font-size="12" font-weight="500" fill="#52514e">25%</text>

<!-- legend -->
<g font-size="11.5" fill="#3d3b37">
<rect x="44" y="360" width="10" height="10" rx="2" fill="#003894"/>
<text x="61" y="369">Ibiden <tspan fill="#89877f">30%</tspan></text>
<rect x="44" y="382" width="10" height="10" rx="2" fill="#46443f"/>
<text x="61" y="391">Unimicron <tspan fill="#89877f">22%</tspan></text>
<rect x="44" y="404" width="10" height="10" rx="2" fill="#7c7a73"/>
<text x="61" y="413">Shinko <tspan fill="#89877f">15%</tspan></text>
<rect x="188" y="360" width="10" height="10" rx="2" fill="#b2b0a8" stroke="#c9c7c0" stroke-width="0.5"/>
<text x="205" y="369">AT&amp;S <tspan fill="#89877f">8%</tspan></text>
<rect x="188" y="382" width="10" height="10" rx="2" fill="#e4e2db" stroke="#c9c7c0" stroke-width="0.5"/>
<text x="205" y="391">Others <tspan fill="#89877f">25%</tspan></text>
</g>
</g>

<!-- ===================== ARROW : Ibiden slice → callout ===================== -->
<path d="M249 146 C 278 130, 298 128, 322 138" fill="none" stroke="#993C1D" stroke-width="2" marker-end="url(#arrowhead)"/>
<!-- ===================== CALLOUT (right) ===================== -->
<rect x="336" y="118" width="280" height="196" rx="12" fill="#fcfcfb" stroke="#d8d6cf" stroke-width="1"/>
<!-- block 1: government subsidy -->
<rect x="352" y="134" width="248" height="58" rx="8" fill="#e8f0fb" stroke="#003894" stroke-width="0.5"/>
<text x="366" y="150" font-size="8.8" font-weight="600" fill="#003894" letter-spacing="0.8">GOVERNMENT SUBSIDY</text>
<text x="366" y="168" font-size="14" font-weight="600" fill="#002a70">≈$260M <tspan font-size="9.8" font-weight="400" fill="#3d3b37">¥40.5B maximum</tspan></text>
<text x="366" y="184" font-size="9.6" fill="#3d3b37">METI Ono-plant plan, Apr 2023, under 1/3 of cost.</text>

<!-- block 2: customer prepaid capital -->
<rect x="352" y="202" width="248" height="58" rx="8" fill="rgb(239,237,250)" stroke="#7F77DD" stroke-width="0.5"/>
<text x="366" y="218" font-size="8.8" font-weight="600" fill="rgb(83,74,183)" letter-spacing="0.8">CUSTOMER PREPAID CAPITAL</text>
<text x="366" y="236" font-size="14" font-weight="600" fill="rgb(63,55,150)">≈$520M <tspan font-size="9.8" font-weight="400" fill="#3d3b37">¥81.0B advances received</tspan></text>
<text x="366" y="252" font-size="9.6" fill="#3d3b37">Held at Mar 31 2026; ¥92.1B a year earlier.</text>

<!-- block 3: what it buys -->
<rect x="352" y="270" width="248" height="28" rx="8" fill="#f4f3ee"/>
<text x="476" y="288" text-anchor="middle" font-size="9.8" font-weight="500" fill="#52514e">¥500B (≈$3.2B) capex → 2.5× capacity by 2028.</text>

<!-- ===================== SOURCES (stacked) ===================== -->
<g font-size="9.5" fill="#89877f">
<text x="32" y="412">Market share estimates: datagravity.dev, “The ABF Substrate Bottleneck.”</text>
<text x="32" y="425">Subsidy: IBIDEN, “Approval of supply securing plan for Ono plant,” Apr 28 2023 (¥40.5B maximum, rate under 1/3).</text>
<text x="32" y="438">Advances received: IBIDEN consolidated financial results for the year ended Mar 31 2026, May 11 2026 (¥80,950M).</text>
<text x="32" y="451">USD figures converted at ¥156/$, the rate implied by the article's ¥500B ≈ $3.2B.</text>
</g>
</svg>
