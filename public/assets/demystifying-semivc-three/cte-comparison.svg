<svg width="100%" viewBox="0 0 680 284" role="img" xmlns="http://www.w3.org/2000/svg" font-family="&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif">
<title>Only T-glass expands at silicon's pace</title>
<desc>Horizontal bars showing thermal expansion in parts per million per degree Celsius: silicon 2.6, T-glass 2.8 highlighted in blue, standard E-glass 5.5, copper 17, and epoxy resin about 55. A shaded band labelled match zone marks where a material grows at silicon's rate; only T-glass falls inside it.</desc>

<rect x="0" y="0" width="680" height="284" fill="#ffffff"/>

<!-- ===================== TITLE ===================== -->
<text x="40" y="28" font-size="16" font-weight="600" fill="#0b0b0b">Only T-glass expands at silicon's pace</text>
<text x="40" y="50" font-size="11.5" font-weight="400" fill="#89877f" letter-spacing="0.6">THERMAL EXPANSION OF CHIP-PACKAGE MATERIALS, PPM PER °C</text>

<!-- ===================== SILICON ZONE ===================== -->
<rect x="200" y="80" width="22" height="170" fill="#e8f0fb"/>
<line x1="222" y1="80" x2="222" y2="250" stroke="#7aa3d8" stroke-width="0.8" stroke-dasharray="3 3"/>

<!-- ===================== BARS ===================== -->
<rect x="200" y="82" width="18" height="20" rx="3" fill="#46443f"/>
<text x="190" y="96" text-anchor="end" font-size="12" fill="#3d3b37">Silicon</text>
<text x="232" y="96" font-size="11.5" fill="#52514e">2.6</text>

<rect x="200" y="116" width="20" height="20" rx="3" fill="#003894"/>
<text x="190" y="130" text-anchor="end" font-size="12" font-weight="600" fill="#003894">T-glass</text>
<text x="234" y="130" font-size="11.5" font-weight="600" fill="#003894">2.8</text>

<rect x="200" y="150" width="39" height="20" rx="3" fill="#b2b0a8"/>
<text x="190" y="164" text-anchor="end" font-size="12" fill="#3d3b37">E-glass</text>
<text x="251" y="164" font-size="11.5" fill="#52514e">5.5</text>

<rect x="200" y="184" width="119" height="20" rx="3" fill="#b2b0a8"/>
<text x="190" y="198" text-anchor="end" font-size="12" fill="#3d3b37">Copper</text>
<text x="331" y="198" font-size="11.5" fill="#52514e">17</text>

<rect x="200" y="218" width="385" height="20" rx="3" fill="#b2b0a8"/>
<text x="190" y="232" text-anchor="end" font-size="12" fill="#3d3b37">Epoxy resin</text>
<text x="597" y="232" font-size="11.5" fill="#52514e">55</text>

<line x1="200" y1="250" x2="620" y2="250" stroke="#d8d6cf" stroke-width="1"/>
<text x="211" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#003894">Match zone</text>

</svg>
