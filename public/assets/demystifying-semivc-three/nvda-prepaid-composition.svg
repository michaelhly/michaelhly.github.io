<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Column chart of total prepaid supply and capacity balances at fiscal year end in billions of dollars: 3.4 disclosed in fiscal 2023, 5.0 in fiscal 2024, 5.0 in fiscal 2025, and an estimated 4.5 in fiscal 2026 shown as hatched segments of 1.3 billion reported HBM advances and 3.2 billion unattributed. A superposed line read against a right-hand axis in millions of units shows estimated data center GPU unit shipments rising from 2.6 million in fiscal 2023 to roughly 6 million in fiscal 2026.</desc>
